name: publish-dsh

# The dsh plugin is a second npm package. It cannot be published by publish.yml:
# trusted publishing verifies the workflow against the package it is bound to,
# and publish.yml is bound to `agent-feedback-loop`. One workflow per package is
# therefore the only arrangement npm accepts, which is why this file exists
# instead of an extra step in the other one.
#
# Same identity model as publish.yml: the workflow authenticates over OIDC, so
# there is no stored token, nothing to rotate, and nothing to leak into git.
#
# One-time setup, on npmjs.com (not in this repo):
#   Package agent-feedback-loop-dsh -> Settings -> Trusted Publisher -> GitHub Actions
#     Organization/user: super3ben
#     Repository:        agent-feedback-loop
#     Workflow name:     publish-dsh.yml
#     Environment:       (leave empty)
#
# Until that binding exists the `npm publish` step fails with 404/401 — the
# expected symptom of a missing binding, not a broken workflow.
#
# Publication is gated on the version being bumped, the same way the main
# package is: re-running on an already-published version does nothing instead of
# failing, so a retried job is harmless.
#
# scripts/publish.mjs pushes the `dsh-v<version>` tag, and asserts the plugin
# version equals the package version before it pushes anything. That invariant
# is what keeps this package from drifting: it was last published at 0.9.0 while
# the runtime had moved on, and the marketplace card showed that stale version.

on:
  push:
    tags:
      - "dsh-v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run every check but do not publish"
        type: boolean
        default: false

concurrency:
  group: publish-dsh-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  # Required for OIDC. Without id-token: write npm cannot verify the workflow
  # and trusted publishing silently falls back to "no credentials", which then
  # surfaces as a confusing 401.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The suite reads git state in a few places; a shallow clone is enough
          # for everything else and keeps the job fast.
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # The plugin is a thin layer over the runtime and can never support an
          # older Node than the runtime does, so this tracks the same floor.
          node-version: "24.15.0"
          registry-url: "https://registry.npmjs.org"

      - name: Upgrade npm to a version that supports trusted publishing
        # Trusted publishing needs npm >= 11.5.1. The npm bundled with the
        # Node 24 line is older than that, so it is upgraded explicitly rather
        # than relying on the image's default.
        run: npm install -g npm@^11.5.1

      - name: Report versions
        run: |
          node --version
          npm --version

      - name: Run the test suite
        # The plugin imports the runtime's modules, so a broken runtime is a
        # broken plugin. Running the suite here costs a few minutes and is the
        # only thing standing between a bad refactor and an unrecoverable
        # publish (npm allows unpublish only within 72 hours).
        run: npm test

      - name: Check the tarball contents
        working-directory: templates/dsh-plugin
        # The plugin is exactly three files. Anything else that lands in the
        # tarball — a stray note, a local config, a test fixture — would be
        # copied into every user's dsh profile, so the set is asserted, not
        # merely scanned for obvious secrets.
        run: |
          npm pack --dry-run --json > /tmp/dsh-pack.json
          node --input-type=commonjs -e '
            const [packed] = require("/tmp/dsh-pack.json");
            const expected = ["cordis.patch.yml", "index.js", "package.json"];
            const actual = packed.files.map((file) => file.path).sort();
            console.log(`${packed.entryCount} files, ${(packed.unpackedSize / 1024).toFixed(0)} KB unpacked`);
            if (JSON.stringify(actual) !== JSON.stringify(expected)) {
              console.error("the plugin tarball must contain exactly " + expected.join(", "));
              console.error("it contains: " + actual.join(", "));
              process.exit(1);
            }
            console.log("tarball is exactly the plugin");
          '

      - name: Check whether this version is already published
        id: version
        working-directory: templates/dsh-plugin
        run: |
          NAME=$(node -p 'require("./package.json").name')
          LOCAL=$(node -p 'require("./package.json").version')
          PUBLISHED=$(npm view "$NAME" version 2>/dev/null || true)
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "local=$LOCAL" >> "$GITHUB_OUTPUT"
          echo "published=$PUBLISHED" >> "$GITHUB_OUTPUT"
          if [ "$LOCAL" = "$PUBLISHED" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$NAME@$LOCAL is already on the registry; nothing to publish."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "::notice::registry has ${PUBLISHED:-(nothing)}, publishing $LOCAL"
          fi

      - name: Publish to npm
        if: steps.version.outputs.skip == 'false' && inputs.dry_run != true
        working-directory: templates/dsh-plugin
        # No NODE_AUTH_TOKEN: the credential comes from the OIDC exchange, and
        # --provenance records which commit and workflow produced the tarball.
        # The working directory is the package here — publishing from the repo
        # root would ship the runtime under the wrong name.
        run: npm publish --provenance --access public

      - name: Verify the registry serves this version
        if: steps.version.outputs.skip == 'false' && inputs.dry_run != true
        working-directory: templates/dsh-plugin
        # npm acknowledges a publish with "+ name@version" while the package is
        # still being processed, and the registry keeps serving the PREVIOUS
        # version for a while after that. A single read straight after the
        # publish step therefore fails on a release that actually succeeded.
        # Poll until propagation finishes instead of treating "not yet" as
        # "failed".
        run: |
          NAME=$(node -p 'require("./package.json").name')
          LOCAL=$(node -p 'require("./package.json").version')
          for attempt in $(seq 1 30); do
            LIVE=$(npm view "$NAME" version 2>/dev/null || true)
            echo "attempt $attempt: registry reports ${LIVE:-(nothing)}"
            if [ "$LIVE" = "$LOCAL" ]; then
              echo "::notice::$NAME@$LOCAL is live"
              exit 0
            fi
            sleep 10
          done
          echo "::error::$NAME@$LOCAL was accepted but the registry never served it"
          exit 1

      - name: Summary
        if: always()
        run: |
          {
            echo "## publish-dsh"
            echo ""
            echo "| field | value |"
            echo "| --- | --- |"
            echo "| package | ${{ steps.version.outputs.name || 'agent-feedback-loop-dsh' }} |"
            echo "| version | ${{ steps.version.outputs.local || '(unknown)' }} |"
            echo "| registry before | ${{ steps.version.outputs.published || '(unknown)' }} |"
            echo "| skipped | ${{ steps.version.outputs.skip || 'n/a' }} |"
          } >> "$GITHUB_STEP_SUMMARY"
