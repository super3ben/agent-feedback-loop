name: publish

# Trusted Publishing: npm authenticates the WORKFLOW, not a stored secret.
#
# npm is retiring 2FA-bypass tokens for direct publishing in January 2027, so a
# long-lived `_authToken` in ~/.npmrc stops being a viable release path. This
# workflow proves its identity to the registry with a short-lived OIDC token
# instead: no secret in the repository, nothing to rotate, nothing to leak.
#
# One-time setup, on npmjs.com (not in this repo):
#   Package agent-feedback-loop -> Settings -> Trusted Publisher -> GitHub Actions
#     Organization/user: super3ben
#     Repository:        agent-feedback-loop
#     Workflow name:     publish.yml
#     Environment:       (leave empty)
#
# Until that binding exists the `npm publish` step fails with 404/401 — that is
# the expected symptom of a missing binding, not a broken workflow.
#
# Publication is gated on the version being bumped. Re-running this workflow on
# an already-published version does nothing rather than failing the run, so a
# retried job is harmless.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run every check but do not publish"
        type: boolean
        default: false

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  # Required for OIDC. Without id-token: write npm cannot verify the workflow
  # and trusted publishing silently falls back to "no credentials", which then
  # surfaces as a confusing 401.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The suite reads git state in a few places; a shallow clone is enough
          # for everything else and keeps the job fast.
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # The package requires >=24.15.0 (it uses node:sqlite), so this must
          # stay at or above that floor.
          node-version: "24.15.0"
          registry-url: "https://registry.npmjs.org"

      - name: Upgrade npm to a version that supports trusted publishing
        # Trusted publishing needs npm >= 11.5.1. The npm bundled with the
        # Node 24 line is older than that, so it is upgraded explicitly rather
        # than relying on the image's default.
        run: npm install -g npm@^11.5.1

      - name: Report versions
        run: |
          node --version
          npm --version

      - name: Run the test suite
        # The suite is the only thing that catches a change that merely looks
        # correct, and a broken release is not recoverable: npm allows
        # unpublish only within 72 hours.
        run: npm test

      - name: Check the tarball contents
        # Guards against shipping credentials or local workflow state. This
        # mirrors the same check in scripts/publish.mjs so a release cannot
        # become unsafe by taking a different path.
        run: |
          npm pack --dry-run --json > /tmp/pack.json
          node -e '
            const [packed] = require("/tmp/pack.json");
            console.log(`${packed.entryCount} files, ${(packed.unpackedSize / 1024).toFixed(0)} KB unpacked`);
            const suspicious = packed.files
              .map((file) => file.path)
              .filter((file) => /(^|\/)(\.env|\.npmrc|test\/|\.agent\/|\.comet\/|docs\/)/u.test(file));
            if (suspicious.length) {
              console.error("the package would ship files that must stay local:\n" + suspicious.join("\n"));
              process.exit(1);
            }
            console.log("no credentials, tests or workflow state included");
          '

      - name: Check whether this version is already published
        id: version
        run: |
          LOCAL=$(node -p 'require("./package.json").version')
          PUBLISHED=$(npm view "$(node -p 'require("./package.json").name')" version 2>/dev/null || true)
          echo "local=$LOCAL" >> "$GITHUB_OUTPUT"
          echo "published=$PUBLISHED" >> "$GITHUB_OUTPUT"
          if [ "$LOCAL" = "$PUBLISHED" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$LOCAL is already on the registry; nothing to publish."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "::notice::registry has ${PUBLISHED:-(nothing)}, publishing $LOCAL"
          fi

      - name: Publish to npm
        if: steps.version.outputs.skip == 'false' && inputs.dry_run != true
        # No NODE_AUTH_TOKEN. The credential comes from the OIDC exchange, and
        # --provenance records which commit and workflow produced the tarball.
        run: npm publish --provenance --access public

      - name: Verify the registry serves this version
        if: steps.version.outputs.skip == 'false' && inputs.dry_run != true
        run: |
          LOCAL=$(node -p 'require("./package.json").version')
          LIVE=$(npm view "$(node -p 'require("./package.json").name')" version)
          echo "registry reports $LIVE"
          test "$LIVE" = "$LOCAL"

      - name: Summary
        if: always()
        run: |
          {
            echo "## publish"
            echo ""
            echo "| field | value |"
            echo "| --- | --- |"
            echo "| version | ${{ steps.version.outputs.local || '(unknown)' }} |"
            echo "| registry before | ${{ steps.version.outputs.published || '(unknown)' }} |"
            echo "| skipped | ${{ steps.version.outputs.skip || 'n/a' }} |"
          } >> "$GITHUB_STEP_SUMMARY"
